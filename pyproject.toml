[project]
name = "selfbudgeting"
version = "0.1.0"
description = "Personal finance parsing/storage/analytics infrastructure"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
